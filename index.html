<body class="checking">
<!-- warp: the transporter, the first moment of a visit (Vemir, 28 Oct: "a surreal immersive transporter a la Space Odyssey
     as a loading screen, minimalist"). Light streams toward you on two walls with a dark slit between them, as in 2001's
     Star Gate, while the block loads; then it floods to paper and the page is there. Drawn in CSS only, so it keeps moving
     while the page's own code starts, with no graphics card too. Once per visit (per tab), whatever the computer's motion
     setting (28 Oct: "work anyway agnostically"); never in high contrast or with ?test (?warp shows it anyway); a click, a tap or a key arrives at once. The password screen starts it and the page
     carries it on from the same moment and the same streaks (tools/lock-site.py copies this block there). -->
<style>
/* the walls' own light, brass and caramel at the near edges, dark at the slit: painted once and never animated, so the only
   things that move are the thin streaks and, at the end, three plain fades (cheap for any computer, with or without a
   graphics card: Windows laptops on their built-in or no GPU included) */
.warp { display: none; position: fixed; inset: 0; z-index: 100; overflow: hidden; contain: strict;
  background: linear-gradient(90deg, rgba(181, 120, 42, .2), rgba(181, 120, 42, 0) 36%, rgba(199, 123, 107, 0) 64%, rgba(217, 163, 91, .17)), #0C0603; }
.warp-on .warp { display: block; }
.warp-fade .warp { animation: vf-warp-in .45s ease-out both; }
.warp-field { position: absolute; inset: 0; }
/* one streak: it starts at the slit, far away and faint, and speeds up and lengthens as it comes past */
.warp-field i { position: absolute; left: 50%; top: 50%; width: var(--l); height: var(--h); margin-top: calc(var(--h) / -2); border-radius: var(--h); transform-origin: 0 50%; opacity: 0;
  background: linear-gradient(90deg, rgba(var(--c), 0), rgba(var(--c), 1) 84%, rgba(var(--c), .4)); animation: vf-streak var(--d) cubic-bezier(.62, 0, .96, .6) var(--w) infinite; }
.warp-glow, .warp-flash { position: absolute; inset: 0; opacity: 0; }
.warp-glow { background: radial-gradient(closest-side, #FAF6EC, #FAF6EC 24%, rgba(245, 237, 216, .9) 42%, rgba(217, 163, 91, .45) 70%, rgba(181, 120, 42, 0)); transform: scale(.5); }
.warp-flash { background: #FAF6EC; }
/* the arrival: everything rushes past, the light at the end floods the screen, and the page is under it */
.warp-out .warp-field { transform: scale(1.9); transition: transform .8s cubic-bezier(.55, 0, 1, .45); }
.warp-out .warp-glow { opacity: 1; transform: scale(1.9); transition: opacity .22s ease-out, transform .72s cubic-bezier(.55, 0, .9, .55); }
.warp-out .warp-flash { opacity: 1; transition: opacity .26s ease-in .48s; }   /* the even paper only once the light has filled the screen */
.warp-gone .warp { background: none; pointer-events: none; }
.warp-gone .warp-field, .warp-gone .warp-glow { visibility: hidden; }
.warp-gone .warp-flash { opacity: 0; transition: opacity .7s ease; }
/* a computer that gets the stills arrives in half the time */
.warp-fast.warp-out .warp-field { transition-duration: .45s; }
.warp-fast.warp-out .warp-glow { transition-duration: .14s, .42s; }
.warp-fast.warp-out .warp-flash { transition-duration: .16s; transition-delay: .26s; }
.warp-fast.warp-gone .warp-flash { transition-duration: .36s; }
@keyframes vf-streak { 0% { opacity: 0; transform: rotate(var(--a)) translateX(var(--r0)) scaleX(.04); } 22% { opacity: var(--o); }
  100% { opacity: var(--o); transform: rotate(var(--a)) translateX(var(--r1)) scaleX(1); } }
@keyframes vf-warp-in { from { opacity: 0; } }
@media (forced-colors: active) { .warp { display: none !important; } }   /* Windows high contrast: straight to the page */
</style>
<div class="warp" id="warp" aria-hidden="true"><div class="warp-field"></div><div class="warp-glow"></div><div class="warp-flash"></div></div>
<script>
(function () {
  "use strict";
  var d = document.documentElement, el = document.getElementById("warp"), field = el.firstChild, q = location.search;
  var calm = !!(window.matchMedia && window.matchMedia("(forced-colors: active)").matches);   // high contrast repaints its colours
  var t0 = 0, seed = 1, on = false, over = false, loaded = false, timer = 0, EV = ["pointerdown", "keydown", "wheel", "touchstart"];
  function get(k) { try { return window.sessionStorage.getItem(k); } catch (e) { return null; } }
  function put(k, v) { try { if (v === null) window.sessionStorage.removeItem(k); else window.sessionStorage.setItem(k, v); } catch (e) {} }
  // the same seed draws the same streaks, so the page carries on the password screen's journey exactly
  function rand(s) { return function () { s = s + 0x6D2B79F5 | 0; var t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function draw(lag) {
    var r = rand(seed), W = window.innerWidth || 1280, H = window.innerHeight || 800, M = Math.max(W, H), n = Math.min(W, H) < 700 ? 72 : 96, out = "";
    var top = Math.min(72, Math.max(54, Math.atan2(H, W) * 180 / Math.PI + 8));   // how steep a streak may run: taller screens, steeper
    // paper, cream, brass, caramel, a dusty rose and VF's AR blue, in the shares they are drawn
    var C = [["250, 246, 236", .2], ["245, 237, 216", .2], ["181, 120, 42", .26], ["217, 163, 91", .18], ["199, 123, 107", .08], ["55, 138, 221", .08]];
    for (var i = 0; i < n; i++) {
      var a = (r() * 2 - 1) * top, c = r(), k = 0; while (k < C.length - 1 && (c -= C[k][1]) > 0) k++;
      var cs = Math.cos(a * Math.PI / 180), sn = Math.abs(Math.sin(a * Math.PI / 180));
      var r0 = M * (.025 + r() * .07) / cs, edge = Math.min(W / 2 / cs, sn > .001 ? H / 2 / sn : 1e9);
      var wide = r() < .1, h = wide ? 6 + r() * 10 : r() < .2 ? 2 : 1, o = wide ? .06 + r() * .09 : .25 + r() * .6;
      var dur = .75 + r() * 1.1, len = M * (.12 + r() * r() * .45);
      out += '<i style="--a:' + (i % 2 ? 180 + a : a).toFixed(2) + "deg;--r0:" + r0.toFixed(1) + "px;--r1:" + (edge * 1.04).toFixed(1) + "px;--l:" + len.toFixed(1) +
        "px;--h:" + h.toFixed(1) + "px;--o:" + o.toFixed(2) + ";--c:" + C[k][0] + ";--d:" + dur.toFixed(3) + "s;--w:" + (r() * .5 - lag).toFixed(3) + 's"></i>';
    }
    field.innerHTML = out;
  }
  // each streak leaves the slit in the first half second; a page carrying the journey on starts them that far along
  function begin(lag) { on = true; draw(lag); d.classList.add("warp-on"); }
  function arrive(fast) {
    if (!on || over) return; over = true; clearInterval(timer);
    EV.forEach(function (e) { window.removeEventListener(e, skip, true); });
    d.classList.remove("warp-fade"); if (fast) d.classList.add("warp-fast"); d.classList.add("warp-out");
    setTimeout(function () { d.classList.add("warp-gone"); }, fast ? 430 : 750);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); d.classList.remove("warp-on", "warp-out", "warp-gone", "warp-fast"); }, fast ? 800 : 1500);
  }
  function skip() { if (Date.now() - t0 > 300) arrive(); }
  // the page is there when the block has drawn its first frame (or the stills stand in), and its fonts and pictures are in;
  // never sooner than 1.5 seconds into the journey, never later than 4.2. A computer that gets the stills (no graphics card,
  // or one too weak for the block: many a Windows laptop) is a slow one, so it gets its page as soon as that's known, from 0.9,
  // and arrives in half the time
  function check() {
    var t = Date.now() - t0, cl = d.classList, still = cl.contains("no-gl");
    if (t > 4200 || (loaded && (t > 1500 && (cl.contains("ready") || cl.contains("page-plain")) || t > 900 && still))) arrive(still);
  }
  // on the password screen (its own html is marked; the page written in its place is not): it starts when the password
  // opens the page (or a remembered key is about to), and stops if not
  if (d.hasAttribute("data-lock")) {
    window.VFWarp = {
      start: function (fade) {
        if (on) return true;
        if (calm || get("vf-warp")) return false;
        t0 = Date.now(); seed = Math.floor(Math.random() * 2147483646) + 1; put("vf-warp", "1"); put("vf-warp-t0", t0 + ":" + seed);
        if (fade) d.classList.add("warp-fade");
        begin(0); return true;
      },
      stop: function () { on = false; d.classList.remove("warp-on", "warp-fade"); field.innerHTML = ""; put("vf-warp", null); put("vf-warp-t0", null); }
    };
    return;
  }
  var hand = /^(\d+):(\d+)$/.exec(get("vf-warp-t0") || ""), now = Date.now(); put("vf-warp-t0", null);
  if (hand && now >= +hand[1] && now - hand[1] < 15000) { t0 = +hand[1]; seed = +hand[2]; }
  else if (!calm && (/[?&]warp\b/.test(q) || (!/[?&]test\b/.test(q) && !get("vf-warp")))) { t0 = now; seed = Math.floor(Math.random() * 2147483646) + 1; put("vf-warp", "1"); }
  else { el.parentNode.removeChild(el); return; }
  begin((now - t0) / 1000);
  EV.forEach(function (e) { window.addEventListener(e, skip, { capture: true, passive: true }); });
  window.addEventListener("load", function () { loaded = true; check(); });
  timer = setInterval(check, 100);
})();
</script>

<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("vf-data").textContent), KEEP = "vf-lock-v1";
  var form = document.getElementById("lock"), pw = document.getElementById("pw"), keep = document.getElementById("keep");
  var go = document.getElementById("go"), status = document.getElementById("status");
  if (window.VFLogo) document.getElementById("logo").outerHTML = window.VFLogo.svg({ label: "Virtual Fudge" });
  // the browser's crypto only runs on https (and localhost): send plain-http visitors to the https address
  if (location.protocol === "http:" && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
    location.replace("https:" + location.href.slice(5)); return;
  }
  function b64d(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64e(u) { var s = ""; for (var i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s); }
  function read() { try { return JSON.parse(localStorage.getItem(KEEP)); } catch (e) { return null; } }
  function save(v) { try { localStorage.setItem(KEEP, JSON.stringify(v)); } catch (e) {} }
  function forget() { try { localStorage.removeItem(KEEP); } catch (e) {} }
  function show() { document.body.classList.remove("checking"); pw.focus(); }
  function decrypt(key) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(D.iv) }, key, b64d(D.ct)); }
  function enter(buf, wait) {   // the page replaces this one only once this one has finished loading (a document still loading ignores it)
    var html = new TextDecoder().decode(buf);
    function swap() { document.open(); document.write(html); document.close(); }
    function later() { setTimeout(swap, wait || 0); }   // wait: the transporter's fade over the form, so the page takes it on whole
    if (document.readyState === "complete") later(); else window.addEventListener("load", later, { once: true });
  }
  if (!window.crypto || !crypto.subtle || !window.TextDecoder) {
    show(); go.disabled = true; pw.disabled = true;
    status.textContent = "This browser can’t open the preview. Please use a current Chrome, Edge, Safari or Firefox."; return;
  }
  if (/[?&]forget(&|=|$)/.test(location.search)) forget();
  var kept = read();
  if (kept && kept.salt === D.salt && kept.k) {
    crypto.subtle.importKey("raw", b64d(kept.k), "AES-GCM", false, ["decrypt"]).then(decrypt).then(enter, function () { forget(); if (window.VFWarp) window.VFWarp.stop(); show(); });
  } else show();
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!pw.value) { status.className = "status bad"; status.textContent = "Please enter the password."; pw.focus(); return; }
    go.disabled = true; status.className = "status"; status.textContent = "Opening…";
    var key;
    crypto.subtle.importKey("raw", new TextEncoder().encode(pw.value), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64d(D.salt), iterations: D.iter, hash: "SHA-256" }, base,
        { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    }).then(function (k) { key = k; return decrypt(k); }).then(function (buf) {
      var wait = window.VFWarp && window.VFWarp.start(true) ? 450 : 0;
      if (!keep.checked) { forget(); enter(buf, wait); return; }
      return crypto.subtle.exportKey("raw", key).then(function (raw) { save({ salt: D.salt, k: b64e(new Uint8Array(raw)) }); enter(buf, wait); });
    }, function () {
      go.disabled = false; status.className = "status bad"; status.textContent = "That password didn’t work. Please try again.";
      pw.select(); pw.focus();
    });
  });
})();
</script>
