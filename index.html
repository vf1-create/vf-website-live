<style>
:root { --espresso: #1A0D05; --paper: #FAF6EC; --brass: #B5782A; --ink: var(--espresso); --ink-quiet: rgba(26, 13, 5, .74);

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); }
body { font: 400 17px/1.6 var(--f-serif); font-optical-sizing: auto; display: grid; place-items: center; min-height: 100vh;
  min-height: 100svh; padding: 32px 16px; }
main { width: 100%; max-width: 400px; }
.vf-logo { display: block; width: 168px; height: auto; margin: 0 0 40px; }
h1 { font-size: clamp(30px, 6vw, 38px); line-height: 1.1; font-weight: 400; margin: 0 0 12px; letter-spacing: -.01em; }
p { margin: 0 0 28px; color: var(--ink-quiet); }
label { display: block; }
.field label { font-size: 15px; margin: 0 0 6px; }
input[type=password] { width: 100%; height: 48px; padding: 0 14px; border: 1px solid var(--ink-faint); background: #fff;
  color: var(--ink); font: 400 17px/1 var(--f-serif); border-radius: 0; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.remember { display: flex; align-items: center; gap: 10px; margin: 16px 0 24px; font-size: 15px; color: var(--ink-quiet); }
.remember input { width: 18px; height: 18px; margin: 0; accent-color: var(--brass); }
button { display: inline-flex; align-items: center; min-height: 46px; padding: 0 22px; border: 1px solid var(--brass);
  background: rgba(250, 246, 236, .55); color: var(--ink); font: 500 16px/1 var(--f-serif); cursor: pointer;
  transition: background-color .2s ease, color .2s ease; }
button:hover { background: var(--brass); color: var(--espresso); }
button[disabled] { opacity: .6; cursor: progress; }
.status { min-height: 1.6em; margin: 16px 0 0; font-size: 15px; color: var(--ink-quiet); }
.status.bad { color: #8a2a12; }
.checking main { visibility: hidden; }
@media (prefers-reduced-motion: reduce) { button { transition: none; } }

</main>

<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("vf-data").textContent), KEEP = "vf-lock-v1";
  var form = document.getElementById("lock"), pw = document.getElementById("pw"), keep = document.getElementById("keep");
  var go = document.getElementById("go"), status = document.getElementById("status");
  if (window.VFLogo) document.getElementById("logo").outerHTML = window.VFLogo.svg({ label: "Virtual Fudge" });
  // the browser's crypto only runs on https (and localhost): send plain-http visitors to the https address
  if (location.protocol === "http:" && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
    location.replace("https:" + location.href.slice(5)); return;
  }
  function b64d(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64e(u) { var s = ""; for (var i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s); }
  function read() { try { return JSON.parse(localStorage.getItem(KEEP)); } catch (e) { return null; } }
  function save(v) { try { localStorage.setItem(KEEP, JSON.stringify(v)); } catch (e) {} }
  function forget() { try { localStorage.removeItem(KEEP); } catch (e) {} }
  function show() { document.body.classList.remove("checking"); pw.focus(); }
  function decrypt(key) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(D.iv) }, key, b64d(D.ct)); }
  function enter(buf) {   // the page replaces this one only once this one has finished loading (a document still loading ignores it)
    var html = new TextDecoder().decode(buf);
    function swap() { document.open(); document.write(html); document.close(); }
    if (document.readyState === "complete") swap(); else window.addEventListener("load", function () { setTimeout(swap, 0); }, { once: true });
  }
  if (!window.crypto || !crypto.subtle || !window.TextDecoder) {
    show(); go.disabled = true; pw.disabled = true;
    status.textContent = "This browser can’t open the preview. Please use a current Chrome, Edge, Safari or Firefox."; return;
  }
  if (/[?&]forget(&|=|$)/.test(location.search)) forget();
  var kept = read();
  if (kept && kept.salt === D.salt && kept.k) {
    crypto.subtle.importKey("raw", b64d(kept.k), "AES-GCM", false, ["decrypt"]).then(decrypt).then(enter, function () { forget(); show(); });
  } else show();
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!pw.value) { status.className = "status bad"; status.textContent = "Please enter the password."; pw.focus(); return; }
    go.disabled = true; status.className = "status"; status.textContent = "Opening…";
    var key;
    crypto.subtle.importKey("raw", new TextEncoder().encode(pw.value), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64d(D.salt), iterations: D.iter, hash: "SHA-256" }, base,
        { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    }).then(function (k) { key = k; return decrypt(k); }).then(function (buf) {
      if (!keep.checked) { forget(); enter(buf); return; }
      return crypto.subtle.exportKey("raw", key).then(function (raw) { save({ salt: D.salt, k: b64e(new Uint8Array(raw)) }); enter(buf); });
    }, function () {
      go.disabled = false; status.className = "status bad"; status.textContent = "That password didn’t work. Please try again.";
      pw.select(); pw.focus();
    });
  });
})();
</script>
