<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Virtual Fudge</title><meta name="robots" content="noindex">
<script>
(function () {
  var p = location.pathname.toLowerCase(), to = "";
  if (/industr|\/ar-in-|\/ar-for-/.test(p)) to = "#industries";
  else if (/project|work|case/.test(p)) to = "#work";
  else if (/blog|post|tag|categor|news|\/20\d\d\//.test(p)) to = "#blog";
  else if (/contact/.test(p)) to = "#contact";
  else if (/quote|start/.test(p)) to = "#start";
  else if (/about|team|studio/.test(p)) to = "#studio";
  else if (/privacy|legal|terms/.test(p)) to = "#legal";
  else if (/event|show/.test(p)) to = "#shows";
  else if (/career|job/.test(p)) to = "#careers";
  var go = function () { location.replace("/" + location.search + to); };   // a campaign's ?utm_ tags come along
  go(); setTimeout(go, 700); setTimeout(go, 2000);   // again if Safari dropped the first hop (see onward)
})();
</script>
