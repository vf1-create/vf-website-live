# The live site's check (tools/monitor in the private repo vf1-create/vf-website writes this file; don't edit it here).
# Every 30 minutes, after each publish, or by hand (Actions, "Site check", Run workflow): the page loads with no script error,
# its pages open, a phone loads it too. A failed run makes GitHub email the check's owner (GitHub Settings, Notifications,
# Actions: "Only notify for failed workflows"); the GitHub phone app shows the same notice.
name: Site check
on:
  schedule: [{ cron: "7,37 * * * *" }]
  push: { branches: [main] }
  workflow_dispatch:
concurrency: { group: site-check, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.60.0
      # after a publish, give GitHub Pages a minute to serve the new copy
      - if: github.event_name == 'push'
        run: sleep 75
      # a second look a minute and a half later before calling it a failure, so a passing blip on the network emails nobody
      - run: python .github/check.py || (sleep 90 && python .github/check.py)
